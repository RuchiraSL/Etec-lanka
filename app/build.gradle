plugins {
    id 'com.android.application'
}

android {
    namespace 'lk.etec.pos'
    compileSdk 34

    defaultConfig {
        applicationId "lk.etec.pos"
        minSdk 29          // Android 10 or newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    // Signing for the release build: only used when the GitHub Action (or you) provide these values
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
